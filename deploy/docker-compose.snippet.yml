# Service definition for the Trilium MCP server.
#
# This is a *snippet*, not a standalone stack: it is meant to be pasted into the
# compose file that already runs Trilium, so both containers share a network and
# the MCP server can reach Trilium under its service name.
#
# The image is built by `deploy.sh` through a remote Docker context — there is
# deliberately no `build:` key, so the server needs no source checkout. It is
# therefore local-only, which is what `pull_policy: never` below is for.
#
# Adjust: the Trilium service name in `TRILIUM_URL`, the published port, the
# hostnames in MCP_ALLOWED_HOSTS / MCP_ALLOWED_ORIGINS, and the network name at
# the bottom — `web` has to be one the target compose file
# already declares, and it must be the same one Trilium is on, or the service
# name in TRILIUM_URL will not resolve. Compose fails with "network web not
# found" if it is absent; drop the `networks:` key entirely if the stack uses
# only its implicit default network.

  trilium-notecast-mcp:
    image: trilium-notecast-mcp:local
    # The image lives only in this daemon's local store — no registry holds it.
    # Without `pull_policy: never`, `docker compose pull` fails on this service
    # ("pull access denied") and aborts the pull for the whole stack.
    pull_policy: never
    container_name: trilium-notecast-mcp
    # The image defines its own HEALTHCHECK against /healthz, which compose
    # inherits — so `restart: always` also recovers a server that is up but no
    # longer answering. Nothing to declare here.
    restart: always
    # No `depends_on:` on purpose. It would buy nothing — without
    # `condition: service_healthy` it only orders the *start*, and this server
    # touches Trilium on the first tool call, not at startup, so a Trilium that
    # arrives later is never noticed. What it does buy is a hazard: `docker
    # compose up -d trilium-notecast-mcp` pulls declared dependencies up with
    # it and recreates them if their configuration has drifted from what is
    # running — so a deploy of *this* service silently restarted Trilium and,
    # because a newer image happened to be on the host, upgraded it across a
    # database migration. deploy.sh passes --no-deps for the same reason.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    ports:
      # Localhost only — exposed to the outside by a reverse proxy.
      - "127.0.0.1:9151:8000"
    env_file:
      - ./.env.trilium-notecast-mcp
    environment:
      # Trilium reached over the shared compose network, not via the host.
      - TRILIUM_URL=http://triliumnext:8080
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      # Path the reverse proxy mounts the server under. Named after the service
      # so a generic /mcp stays free for other MCP servers on the same host.
      - MCP_PATH=/trilium-notecast-mcp
      # The SDK's DNS-rebinding protection checks the Host header, so the
      # hostname the reverse proxy serves under must be listed here.
      - MCP_ALLOWED_HOSTS=your-host.example.net,127.0.0.1:9151,localhost:9151
      - MCP_ALLOWED_ORIGINS=https://your-host.example.net
    networks:
      - web
